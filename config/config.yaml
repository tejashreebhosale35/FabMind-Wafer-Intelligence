
# ==========================================
# FABMIND CONFIGURATION
# ==========================================

data:
  data_path: "data/raw/LSWMD.pkl"
  processed_dir: "data/processed"

  train_path: "train.pkl"
  validation_path: "validation.pkl"
  test_path: "test.pkl"

  use_existing_split: true

  wafer_column: "waferMap"
  label_column: "failureType"

  image_size: 224
  num_classes: 9

  classes:
    - "none"
    - "Edge-Ring"
    - "Edge-Loc"
    - "Center"
    - "Loc"
    - "Scratch"
    - "Random"
    - "Donut"
    - "Near-full"

preprocessing:
  normalize: true
  mean: [0.5]
  std: [0.5]

  padding_mode: "constant"
  padding_value: 0

model:
  name: "vit_tiny_patch16_224"
  pretrained: true
  in_chans: 1
  num_classes: 9
  dropout: 0.1
  drop_path_rate: 0.1

training:
  batch_size: 4
  num_epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.0001

  optimizer: "adamw"
  scheduler: "cosine"

  warmup_epochs: 5
  gradient_clip: 1.0

  mixed_precision: false
  early_stopping_patience: 3

class_weights:
  use_weights: true
  compute_from_data: true

augmentation:
  random_rotation: 0
  random_flip_horizontal: false
  random_flip_vertical: false
  random_brightness: 0.0
  random_contrast: 0.0

logging:
  log_interval: 10
  save_interval: 5

  log_dir: "outputs/logs"
  checkpoint_dir: "outputs/models"
  visualization_dir: "outputs/visualizations"

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "confusion_matrix"

  save_predictions: true
  visualize_attention: true
  num_visualization_samples: 20

seed: 42
device: "cpu"
num_workers: 0
pin_memory: false
